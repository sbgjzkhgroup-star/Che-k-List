<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Регламенты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#f4f1ec; --bg2:#fbf9f6; --card:#ffffff; --text:#1d1b18; --muted:#8b857c; --line:#ece7df;
  --accent:#ff7a2f; --accent2:#ffb347; --ok:#19b36b; --warn:#ef5b4a; --shadow:0 6px 24px rgba(60,40,10,.08);
}
[data-theme=dark]{
  --bg:#12110f; --bg2:#1a1815; --card:#1f1d1a; --text:#f3efe8; --muted:#8f897f; --line:#2c2924;
  --accent:#ff8a45; --accent2:#ffb347; --ok:#2bd17f; --warn:#ff6b5a; --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:radial-gradient(900px 400px at 100% -10%,rgba(255,122,47,.16),transparent 60%),var(--bg)}
#app{max-width:520px;margin:0 auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom))}
h1{font-size:26px;margin:0;letter-spacing:-.5px}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.top{display:flex;justify-content:space-between;align-items:flex-start;margin:6px 2px 18px}
.avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px;box-shadow:var(--shadow)}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--accent);background:rgba(255,122,47,.12);padding:3px 8px;border-radius:20px;margin-top:6px}

.card{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.shift{display:flex;align-items:center;gap:14px;cursor:pointer;transition:transform .12s}
.shift:active{transform:scale(.98)}
.shift .ico{font-size:26px}
.shift .info{flex:1;min-width:0}
.shift .t{font-weight:700;font-size:17px}
.shift .s{color:var(--muted);font-size:13px;margin-top:3px;line-height:1.35}
.ringwrap{position:relative;width:64px;height:64px;flex:none}
.ringwrap .pc{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:15px}
.ring-bg{fill:none;stroke:var(--line)}
.ring-fg{fill:none;stroke-linecap:round;transition:stroke-dashoffset .5s ease,stroke .3s}

.datenav{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;margin-bottom:14px;box-shadow:var(--shadow)}
.datenav button{border:0;background:var(--bg2);color:var(--text);width:40px;height:40px;border-radius:12px;font-size:20px;cursor:pointer}
.datenav button:disabled{opacity:.3}
.datenav .d{font-weight:700;text-align:center;font-size:15px}
.datenav .d small{display:block;color:var(--muted);font-weight:500;font-size:12px}

h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:22px 4px 10px}
.hist{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.hist .d{flex:1;font-weight:600;font-size:14px}
.pill{font-size:12px;font-weight:700;padding:5px 9px;border-radius:20px;background:var(--bg2);white-space:nowrap}

.head{position:sticky;top:0;z-index:5;margin:-18px -16px 14px;padding:14px 16px 12px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.head .row{display:flex;align-items:center;gap:10px}
.back{border:0;background:var(--card);color:var(--text);width:38px;height:38px;border-radius:12px;font-size:18px;cursor:pointer;box-shadow:var(--shadow)}
.head .tt{flex:1;min-width:0}
.head .tt b{font-size:17px;display:block}
.head .tt span{font-size:12.5px;color:var(--muted)}
.head .big{font-size:24px;font-weight:800}
.bar{height:9px;border-radius:9px;background:var(--line);margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;transition:width .45s ease,background .3s}

.sec{margin-bottom:14px;padding:6px 0 4px;overflow:hidden}
.sec .sh{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 6px;font-weight:700}
.sec .sh span.c{font-size:12px;color:var(--muted);font-weight:600}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;user-select:none}
.item+.item{border-top:1px solid var(--line)}
.item.ro{cursor:default}
.chk{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);flex:none;display:grid;place-items:center;transition:all .18s;background:var(--bg2)}
.chk svg{opacity:0;transform:scale(.4);transition:all .18s}
.item.done .chk{background:var(--ok);border-color:var(--ok)}
.item.done .chk svg{opacity:1;transform:scale(1)}
.item .lb{flex:1;font-size:15.5px;line-height:1.3}
.item.done .lb{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(139,133,124,.5)}
.item .who{font-size:11.5px;color:var(--muted);text-align:right;line-height:1.3;flex:none}
.item.miss .chk{border-color:var(--warn);border-style:dashed}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:0 4px 12px}

.demo{margin-top:26px;text-align:center;font-size:12px;color:var(--muted)}
.demo .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 12px;border-radius:20px;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}

.hist{flex-wrap:wrap}
.hist .d{min-width:130px}
.sum{font-weight:800;font-size:15px;white-space:nowrap}
.form{display:flex;flex-direction:column;gap:10px}
.form input{width:100%;border:1px solid var(--line);background:var(--bg2);color:var(--text);border-radius:14px;padding:14px;font-size:16px;font-family:inherit;outline:none}
.form input:focus{border-color:var(--accent)}
.btn{border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.98)}
.exp{display:flex;align-items:center;gap:12px;padding:12px 16px}
.exp+.exp{border-top:1px solid var(--line)}
.exp .lb{flex:1;font-size:15.5px;line-height:1.3;min-width:0;word-break:break-word}
.exp .lb small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.exp .am{font-weight:700;white-space:nowrap}
.exp .x{border:0;background:var(--bg2);color:var(--muted);width:30px;height:30px;border-radius:10px;font-size:15px;cursor:pointer;flex:none}
.banner{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;cursor:pointer;font-size:14.5px;margin-bottom:14px}
.row2{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;cursor:pointer}
.row2 small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.sw{width:46px;height:28px;border-radius:20px;background:var(--line);position:relative;transition:.2s;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.sw.on{background:var(--ok)}
.sw.on i{left:21px}
.sched-hero{text-align:center;padding:22px 16px}
.sched-hero .lbl{color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.8px;font-weight:600}
.sched-hero .dt{font-size:28px;font-weight:800;margin:8px 0 2px;letter-spacing:-.5px}
.sched-hero .dw{color:var(--muted);font-size:15px;margin-bottom:10px}
.sched-hero .in{display:inline-block;font-size:13px;font-weight:700;color:var(--accent);background:rgba(255,122,47,.12);padding:5px 12px;border-radius:20px}
.sched-hero .next{margin-top:14px;font-size:13.5px;color:var(--muted)}
.day{display:flex;align-items:center;gap:12px;padding:12px 14px}
.day+.day{border-top:1px solid var(--line)}
.day .dn{width:42px;flex:none;text-align:center;line-height:1.15}
.day .dn b{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase}
.day .dn span{font-size:20px;font-weight:800}
.day.today .dn span{color:var(--accent)}
.day .mid{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:6px}
.day .cnt{font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap;text-align:right;min-width:42px}
.day .cnt em{display:block;font-style:normal;font-weight:600;font-size:10.5px}
.day .cnt.bad{color:var(--warn)}
.nm{font-size:13px;font-weight:600;padding:6px 11px;border-radius:20px;border:1px solid var(--line);background:var(--bg2);color:var(--text);font-family:inherit}
.nm.off{background:var(--accent);border-color:var(--accent);color:#fff}
.nm.me{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--accent)}
button.nm{cursor:pointer}
.free{color:var(--muted);font-size:13px;padding:6px 0}
.stf{display:flex;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap}
.stf+.stf{border-top:1px solid var(--line)}
.stf .nmx{flex:1;min-width:110px;font-weight:700}
.stf .nmx small{display:block;color:var(--muted);font-weight:500;font-size:11.5px;margin-top:2px}
.opt{font-size:12px;font-weight:600;padding:7px 10px;border-radius:20px;border:1px solid var(--line);background:var(--bg2);color:var(--muted);cursor:pointer;font-family:inherit}
.opt.on{background:var(--accent);border-color:var(--accent);color:#fff}
.form select{width:100%;border:1px solid var(--line);background:var(--bg2);color:var(--text);border-radius:14px;padding:14px;font-size:16px;font-family:inherit;outline:none}
.muted{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(30px);opacity:0;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;transition:all .3s;z-index:20;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.conf{position:fixed;left:0;top:0;pointer-events:none;font-size:22px;z-index:30;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(540deg);opacity:.2}}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.empty{text-align:center;color:var(--muted);padding:40px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script>
const CL_DEFAULT = {"open":{"title":"Открытие заведения","icon":"🌅","sections":[{"title":"Включить","icon":"🔌","items":["Свет","Моноблок","Телевизор","Бойлер для кипятка","Кондиционер","Тепловая витрина","Меню","Музыка"]},{"title":"Уборка","icon":"🧽","items":["Барной зоны","Кассовой зоны","Контроль уборки зала (полы, стекла, зеркало)"]},{"title":"Заготовки","icon":"🍹","items":["Мохито","Чаи","Айсти","Кикаман соусницы"]},{"title":"Проверка и пополнение","icon":"📦","items":["Напитков","Расходников","Сиропов","Салфеток","Палочек","Контейнеров","Трубочек","Чистоты приборов","Чистоты подносов","Чистоты стаканов"]},{"title":"Отметить","icon":"📝","items":["Людей на смене","Переработки сотрудникам"]}]},"close":{"title":"Закрытие заведения","icon":"🌙","sections":[{"title":"Касса","icon":"💰","items":["Подсчет кассы","Выравнивание кассы (Пейми, Клик, Узум, Узкард, Хумо)","43 и 48 отчет","Закрытие кассовой смены","Проверка расходов","Подсчет денег","Отправка данных в ТГ (снятия)","Терминалы на зарядку","Рабочий телефон на зарядку"]},{"title":"Заготовки","icon":"🍋","items":["Лимоны","Мята"]},{"title":"Проверка","icon":"🔍","items":["Лимоны","Мята","Каркаде","Апельсины","Напитки","Салфетки","Палочки","Контейнеры","Трубочки"]},{"title":"Заказ","icon":"🧾","items":["Заказ заканчивающейся продукции","Контроль заказа"]},{"title":"Заполнение","icon":"🧊","items":["Холодильников","Расходников","Бойлера"]},{"title":"Уборка","icon":"🧽","items":["Барной зоны","Кассовой зоны","Раздачи","Контроль уборки зала"]},{"title":"Выключить","icon":"🔌","items":["Меню","Телевизоры","Бойлер","Тепловую витрину","Кондиционер","Свет"]}]}};
let CL = CL_DEFAULT;
const tg = window.Telegram && window.Telegram.WebApp;
const inTg = !!(tg && tg.initData);
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
document.documentElement.setAttribute('data-theme',
  (tg && tg.colorScheme) ? tg.colorScheme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));

const TZ = 'Asia/Tashkent', CUTOFF = 5;
const dayOf = ts => new Date(ts - CUTOFF * 3600e3).toLocaleDateString('en-CA', { timeZone: TZ });
const shiftDate = (s, n) => { const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const hm = ts => new Date(ts).toLocaleTimeString('ru-RU', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const DAYS = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const fmtDate = s => { const d = new Date(s + 'T00:00:00Z'); return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`; };
const dow = s => DAYS[new Date(s + 'T00:00:00Z').getUTCDay()];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const total = t => CL[t].sections.reduce((a, s) => a + s.items.length, 0);
const doneCount = sh => sh ? Object.keys(sh.items).length : 0;
const pctOf = (sh, t) => Math.round(doneCount(sh) / total(t) * 100);
const col = p => p === 100 ? 'var(--ok)' : p >= 50 ? 'var(--accent)' : p > 0 ? 'var(--warn)' : 'var(--muted)';

/* ---------- API: Telegram (сервер) или демо (localStorage) ---------- */
const DEMO_USERS = [
  { id: '1', name: 'Дамир', role: 'employee' },
  { id: '2', name: 'Азиз', role: 'employee' },
  { id: '99', name: 'Владелец', role: 'owner' }
];
const realApi = {
  async state(date) {
    const r = await fetch('/api/state?date=' + date, { headers: { 'X-Init-Data': tg.initData } });
    if (!r.ok) throw new Error(r.status);
    return r.json();
  },
  async toggle(type, itemId, checked) {
    const r = await fetch('/api/toggle', { method: 'POST', headers: { 'X-Init-Data': tg.initData, 'Content-Type': 'application/json' }, body: JSON.stringify({ type, itemId, checked }) });
    if (!r.ok) throw new Error(r.status);
  },
  async post(url, body) {
    const r = await fetch(url, { method: 'POST', headers: { 'X-Init-Data': tg.initData, 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
    if (!r.ok) throw new Error(r.status);
    return r.json();
  },
  expenseAdd(title, amount) { return this.post('/api/expense', { title, amount }); },
  expenseDel(id) { return this.post('/api/expense/delete', { id }); },
  remind(on) { return this.post('/api/remind', { on }); },
  testNotify() { return this.post('/api/test-notify'); },
  sched(path, body) { return this.post('/api/sched/' + path, body); }
};
const demoApi = (() => {
  const K = 'demo_db_v2';
  const load = () => { try { return JSON.parse(localStorage.getItem(K)) || seed(); } catch (e) { return seed(); } };
  const save = db => { try { localStorage.setItem(K, JSON.stringify(db)); } catch (e) {} };
  const ids = t => CL[t].sections.flatMap((s, si) => s.items.map((_, ii) => `${t}.${si}.${ii}`));
  function seed() {
    const db = { shifts: {}, expenses: {} };
    const y = shiftDate(dayOf(Date.now()), -1);
    const mk = (type, by, n, h0) => {
      const items = {}; ids(type).slice(0, n).forEach((id, i) => items[id] = { by, at: new Date(`${y}T${String(h0).padStart(2,'0')}:00:00+05:00`).getTime() + i * 150000 });
      db.shifts[`${y}|${type}`] = { date: y, type, startedBy: by, startedAt: Object.values(items)[0].at, items };
    };
    mk('open', DEMO_USERS[1], total('open'), 9);
    mk('close', DEMO_USERS[0], Math.round(total('close') * .7), 22);
    db.expenses[y] = [
      { id: 'a1', title: 'Хлеб', amount: 18000, by: DEMO_USERS[1], at: new Date(`${y}T11:20:00+05:00`).getTime() },
      { id: 'a2', title: 'Такси курьеру', amount: 35000, by: DEMO_USERS[0], at: new Date(`${y}T19:05:00+05:00`).getTime() }
    ];
    save(db); return db;
  }
  const me = () => DEMO_USERS.find(u => u.id === (localStorage.getItem('demo_user') || '1')) || DEMO_USERS[0];
  const sumExp = (db, d) => ((db.expenses || {})[d] || []).reduce((a, e) => a + e.amount, 0);
  const remindOn = u => localStorage.getItem('demo_remind_' + u.id) !== '0';
  return {
    async state(date) {
      const db = load(), u = me(), today = dayOf(Date.now());
      if (u.role !== 'owner' || !date) date = today;
      const out = { me: { ...u, remind: remindOn(u) }, today, date, shifts: { open: db.shifts[`${date}|open`] || null, close: db.shifts[`${date}|close`] || null },
        expenses: (db.expenses || {})[date] || [], expTotal: sumExp(db, date),
        schedule: { staff: [], offs: {}, myId: null, users: [] } };
      if (u.role === 'owner') out.history = Array.from({ length: 7 }, (_, i) => {
        const d = shiftDate(today, -i), o = db.shifts[`${d}|open`], c = db.shifts[`${d}|close`];
        return { date: d, exp: sumExp(db, d), open: pctOf(o, 'open'), close: pctOf(c, 'close'), openBy: o && o.startedBy ? o.startedBy.name : null, closeBy: c && c.startedBy ? c.startedBy.name : null };
      });
      return out;
    },
    async toggle(type, itemId, checked) {
      const db = load(), u = me(), date = dayOf(Date.now()), key = `${date}|${type}`;
      const sh = db.shifts[key] || (db.shifts[key] = { date, type, startedBy: null, startedAt: null, items: {} });
      if (checked) {
        if (!sh.items[itemId]) sh.items[itemId] = { by: { id: u.id, name: u.name }, at: Date.now() };
        if (!sh.startedBy) { sh.startedBy = { id: u.id, name: u.name }; sh.startedAt = Date.now(); }
      } else if (sh.items[itemId] && sh.items[itemId].by.id === u.id) delete sh.items[itemId];
      save(db);
    },
    async expenseAdd(title, amount) {
      const db = load(), u = me(), date = dayOf(Date.now());
      db.expenses = db.expenses || {};
      (db.expenses[date] = db.expenses[date] || []).push({ id: String(Date.now()), title, amount, by: { id: u.id, name: u.name }, at: Date.now() });
      save(db);
    },
    async expenseDel(id) {
      const db = load(), date = dayOf(Date.now());
      db.expenses[date] = (db.expenses[date] || []).filter(e => e.id !== id);
      save(db);
    },
    async remind(on) { localStorage.setItem('demo_remind_' + me().id, on ? '1' : '0'); },
    async testNotify() { return { ok: false, error: 'demo' }; }
  };
})();
const api = inTg ? realApi : demoApi;

/* ---------- Состояние и отрисовка ---------- */
const S = { view: 'home', type: null, date: null, data: null, busy: 0 };
const $app = document.getElementById('app');
let lastSig = '';

async function refresh(force) {
  if (S.busy && !force) return;
  try {
    const d = await api.state(S.date || '');
    if (d.checklists) CL = d.checklists;
    S.data = d; S.date = d.date;
    const sig = JSON.stringify(d);
    if (sig !== lastSig || force) {
      // не перерисовываем экран, пока человек печатает, иначе введённый текст пропадёт
      const typing = document.activeElement && ['INPUT', 'SELECT'].includes(document.activeElement.tagName);
      if (!force && typing) return;
      lastSig = sig; render();
    }
  } catch (e) {
    if (!S.data) $app.innerHTML = '<div class="empty">Не удалось загрузить данные.<br>Откройте приложение из Telegram.</div>';
  }
}

function ring(p, size = 64, stroke = 7) {

    <circle class="ring-fg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="${stroke}" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - p / 100)}" transform="rotate(-90 ${size/2} ${size/2})" style="stroke:${col(p)}"/>
  </svg><div class="pc" style="color:${col(p)}">${p}%</div></div>`;
}

/* ---------- Действия ---------- */
function toast(m) { const el = document.getElementById('toast'); el.textContent = m; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2200); }
function haptic(k) { try { tg.HapticFeedback.impactOccurred(k || 'light'); } catch (e) {} }
function confetti() {
  try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
  const em = ['🎉', '✨', '🍋', '🌿', '⭐', '🍹'];
  for (let i = 0; i < 28; i++) {
    const el = document.createElement('div'); el.className = 'conf'; el.textContent = em[i % em.length];
    el.style.left = (Math.random() * 100) + 'vw'; el.style.top = '-30px';
    el.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px');
    el.style.animationDelay = (Math.random() * .4) + 's';
    document.body.appendChild(el); setTimeout(() => el.remove(), 2400);
  }
}
async function toggle(id) {
  const t = S.type, d = S.data, me = d.me;
  let sh = d.shifts[t];
  if (!sh) sh = d.shifts[t] = { date: d.date, type: t, startedBy: null, startedAt: null, items: {} };
  const it = sh.items[id], before = pctOf(sh, t);
  if (it) {
    if (it.by.id !== me.id) { toast('Отметил другой сотрудник — снять нельзя'); return; }
    delete sh.items[id];
  } else {
    sh.items[id] = { by: { id: me.id, name: me.name }, at: Date.now() };
    if (!sh.startedBy) { sh.startedBy = { id: me.id, name: me.name }; sh.startedAt = Date.now(); }
  }
  haptic();
  const now = !it;
  render();
  if (now && before < 100 && pctOf(sh, t) === 100) { confetti(); toast('Готово! 100% 🎉'); }
  S.busy++;
  try { await api.toggle(t, id, now); } catch (e) { toast('Нет связи, попробуйте ещё раз'); }
  S.busy--;
  refresh(true);
}

$app.addEventListener('click', e => {
  const el = e.target.closest('[data-open],[data-item],[data-back],[data-nav],[data-date],[data-user],[data-reset],[data-add-exp],[data-del-exp],[data-remind],[data-test],[data-wk],[data-st-tog],[data-st-flag],[data-st-del],[data-st-add],[data-st-gen]');

  if (el.dataset.open === 'exp') { S.view = 'exp'; window.scrollTo(0, 0); render(); }
  else if (el.dataset.addExp) addExpense();
  else if (el.dataset.delExp) delExpense(el.dataset.delExp);
  else if (el.dataset.remind) toggleRemind();

  else if (el.dataset.wk) { S.week = shiftDate(S.week || mondayOf(S.data.today), 7 * +el.dataset.wk); render(); }
  else if (el.dataset.stTog) { const [d, id, off] = el.dataset.stTog.split('|'); toggleOff(d, id, off === '1'); }
  else if (el.dataset.stFlag) { const [id, key] = el.dataset.stFlag.split('|'); const s = S.data.schedule.staff.find(x => x.id === id); if (s) schedCall('staff', { op: 'update', id, [key]: !s[key] }); }
  else if (el.dataset.stDel) { const s = S.data.schedule.staff.find(x => x.id === el.dataset.stDel); askConfirm('Удалить «' + (s ? s.name : '') + '» из графика? Его выходные тоже удалятся.', () => schedCall('staff', { op: 'delete', id: el.dataset.stDel })); }
  else if (el.dataset.stAdd) addStaff();
  else if (el.dataset.stGen) askConfirm('Составить график на 8 недель вперёд? Выходные на эти недели будут заменены.', () => schedCall('generate', { weeks: 8 }, 'График составлен ✓'));
  else if (el.dataset.open) { S.type = el.dataset.open; S.view = 'list'; window.scrollTo(0, 0); render(); }
  else if (el.dataset.item) toggle(el.dataset.item);
  else if (el.dataset.back) { S.view = 'home'; render(); }
  else if (el.dataset.nav) { S.date = shiftDate(S.data.date, +el.dataset.nav); refresh(true); }
  else if (el.dataset.date) { S.date = el.dataset.date; refresh(true); window.scrollTo(0, 0); }
  else if (el.dataset.user) { localStorage.setItem('demo_user', el.dataset.user); S.view = 'home'; S.date = null; refresh(true); }
  else if (el.dataset.reset) { localStorage.removeItem('demo_db_v2'); S.date = null; refresh(true); toast('Демо-данные сброшены'); }
});

async function addExpense() {

  const amount = parseInt(document.getElementById('exSum').value.replace(/\D/g, ''), 10);
  if (!title) { toast('Напишите, на что потратили'); return; }
  if (!amount) { toast('Введите сумму'); return; }
  S.busy++;
  try { await api.expenseAdd(title, amount); haptic('medium'); toast('Расход добавлен ✓'); }
  catch (e) { toast('Нет связи, попробуйте ещё раз'); S.busy--; return; }
  S.busy--;
  refresh(true);
}

async function toggleRemind() {
  const on = !S.data.me.remind;
  S.data.me.remind = on; render();
  try { await api.remind(on); toast(on ? 'Напоминания включены' : 'Напоминания выключены'); } catch (e) { toast('Нет связи'); }
  refresh(true);
}
async function testNotify() {
  if (!inTg) { toast('В демо-режиме уведомления не отправляются'); return; }
  try {
    const r = await api.testNotify();
    toast(r.ok ? 'Отправлено — проверьте чат с ботом' : 'Не получилось. Нажмите Start в чате с ботом');
  } catch (e) { toast('Нет связи'); }
}
function askConfirm(msg, go) {
  if (tg && tg.showConfirm && inTg) tg.showConfirm(msg, ok => { if (ok) go(); }); else if (confirm(msg)) go();
}
async function schedCall(path, body, okMsg) {
  if (!inTg) { toast('В демо-режиме график недоступен'); return; }
  S.busy++;
  try { await api.sched(path, body); if (okMsg) toast(okMsg); }
  catch (e) { toast('Не удалось сохранить, попробуйте ещё раз'); }
  S.busy--;
  refresh(true);
}
function toggleOff(d, id, off) {
  const offs = S.data.schedule.offs;
  const list = (offs[d] || []).filter(x => x !== id);
  if (off) list.push(id);
  if (list.length) offs[d] = list; else delete offs[d];
  render(); haptic();
  const wd = dowIdx(d);
  if (off && wd >= 1 && wd <= 4) toast('Пн–Чт — пиковые дни: лучше, чтобы работали все');
  schedCall('toggle', { date: d, staffId: id, off });
}
function addStaff() {
  const sel = document.getElementById('stUser'), inp = document.getElementById('stName');
  const tgId = sel ? sel.value : '', name = (inp.value.trim() || (sel && sel.selectedOptions[0] && tgId ? sel.selectedOptions[0].textContent : '')).trim();
  if (!name) { toast('Напишите имя или выберите из списка'); return; }
  schedCall('staff', { op: 'add', name, tg: tgId || null, biweekly: false, church: false }, 'Сотрудник добавлен ✓');
}
// сумма с пробелами между разрядами и Enter для быстрой отправки
$app.addEventListener('toggle', e => { if (e.target.id === 'stDet') S.stOpen = e.target.open; }, true);
$app.addEventListener('change', e => {
  if (e.target.id === 'stUser') {
    const o = e.target.selectedOptions[0], inp = document.getElementById('stName');
    if (e.target.value && inp && !inp.value.trim()) inp.value = o.textContent;
  }
});
$app.addEventListener('input', e => {
  if (e.target.id === 'exSum') {
    const d = e.target.value.replace(/\D/g, '').slice(0, 11);
    e.target.value = d ? Number(d).toLocaleString('ru-RU').replace(/[  ]/g, ' ') : '';
  }
});
$app.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'exTitle') document.getElementById('exSum').focus();
  else if (e.key === 'Enter' && e.target.id === 'exSum') addExpense();
});

refresh(true);
setInterval(() => refresh(false), 8000);
</script>
